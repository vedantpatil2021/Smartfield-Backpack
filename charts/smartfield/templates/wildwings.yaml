apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildwings
  namespace: {{ .Release.Namespace }}
  labels:
    app: wildwings
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wildwings
  template:
    metadata:
      labels:
        app: wildwings
    spec:
      hostNetwork: true                   # needed for drone WiFi
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: wildwings
          image: "{{ .Values.images.wildwings.repository }}:{{ .Values.images.wildwings.tag }}"
          imagePullPolicy: {{ .Values.images.wildwings.pullPolicy }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DISPLAY
              value: ":99"
            - name: OLYMPE_LOG_LEVEL
              value: "WARNING"
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: logs
              mountPath: /var/log/smartfield
            - name: missions
              mountPath: /app/mission
            - name: media
              mountPath: /app/media
            - name: models
              mountPath: /app/models
              readOnly: true
          resources:
            {{- toYaml .Values.resources.wildwings | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.config.wildwings.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            privileged: true   # needs /dev/net/tun, /dev/video*
      volumes:
        - name: config
          configMap:
            name: smartfield-config
        - name: logs
          persistentVolumeClaim:
            claimName: smartfield-logs
        - name: missions
          persistentVolumeClaim:
            claimName: smartfield-missions
        - name: media
          persistentVolumeClaim:
            claimName: smartfield-media
        - name: models
          hostPath:
            path: {{ .Values.models.hostPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: wildwings
  namespace: {{ .Release.Namespace }}
  labels:
    app: wildwings
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: wildwings
  ports:
    - port: {{ .Values.config.wildwings.port }}
      targetPort: {{ .Values.config.wildwings.port }}
